<!DOCTYPE HTML>
<html>
    <head>
        <title>Portfolio</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" id="stylesheet" href="../css/style1.css">
        <link rel="icon" id="favicon" href="../assets/favicon-dark.png">
    </head>
    <body>
        <div data-include="../partials/header2.html"></div>

        <section class="subpage-hero">
            <h1>Portfolio</h1>
        </section>

        <main id="portfolio-main">
            <div class="portfolio-controls">
                <div class="controls-inner">
                    <div class="filters" role="tablist" aria-label="Project filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="school">School</button>
                        <button class="filter-btn" data-filter="personal">Personal</button>
                    </div>
                </div>
            </div>

            <section class="portfolio-grid" id="portfolio-grid" aria-live="polite">
                <!-- project cards will be injected here by js/portfolio.js -->
            </section>
        </main>
        <div data-include="../partials/footer.html"></div>
        <script src="../js/includes.js"></script>
        <script src="../js/portfolio.js"></script>
        <script src="../js/script.js"></script>
    </body>
</html>
